name: Flight delay validation
on: [push, pull_request]
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,modeling,neural,notebook]'
      - run: python -m pytest -q
      # Preserve the byte-frozen experiment module's three existing callback
      # aliases; this narrowly exempts their style rule, not correctness checks.
      - run: python -m ruff check --per-file-ignores 'src/flight_delay/experiments/phase4_final.py:E731' src/flight_delay/models src/flight_delay/experiments src/flight_delay/cli.py tests/test_phase3*.py tests/conftest.py scripts/build_phase3_notebook.py scripts/phase4_build_notebook.py scripts/validate_analysis_notebooks.py scripts/export_source_mlp_details.py tests/test_analysis_notebook_coverage.py
      - run: python -m ipykernel install --prefix .venv --name flight-delay-phase3 --display-name 'Flight Delay (Phase III)'
      - run: python scripts/validate_analysis_notebooks.py
